name: smart_alarmapp
description: Smart Travel Alarm App with Onboarding and Location features.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # State Management
  provider: ^6.1.2
  # Local Storage
  shared_preferences: ^2.2.3
  # UI for Onboarding
  smooth_page_indicator: ^1.1.0
  # Location & Permissions
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  # Notifications
  flutter_local_notifications: ^17.1.2
  # Date Formatting
  intl: ^0.19.0
  # Consistent typography
  google_fonts: ^6.2.1
  # Video Player
  video_player: ^2.8.5
  # Geocoding
  geocoding: ^4.0.0
  # Timezone Support
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/location.png
    - assets/videos/onboarding_1.mp4
    - assets/videos/onboarding_2.mp4
    - assets/videos/onboarding_3.mp4
